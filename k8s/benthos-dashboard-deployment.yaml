apiVersion: apps/v1
kind: Deployment
metadata:
  name: benthos-dashboard
  namespace: benthos-playground
spec:
  selector:
    matchLabels:
      app: benthos-dashboard
  template:
    metadata:
      labels:
        app: benthos-dashboard
    spec:
      containers:
      - name: benthos-dashboard
        image: benthos-dashboard # Skaffold will override this dynamically
        ports:
        - containerPort: 3000
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        readinessProbe:
          tcpSocket:
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 10